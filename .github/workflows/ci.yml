name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project (lean extras; NOT [train], TensorFlow is heavy)
        # The serve path (onnxruntime) + data/viz/dev are installed; the [train]
        # extra (TensorFlow/tf2onnx) is deliberately excluded so CI stays fast and
        # GPU-free. The TF train/export path is marked `slow` and skipped here.
        run: >-
          uv sync --extra data --extra serve --extra viz --extra dev
          --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (pytest + coverage gate)
        run: >-
          uv run pytest -q -m "not slow"
          --cov=lstmforecast --cov-report=term --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
